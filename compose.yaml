services:
  atelier:
    build: .
    init: true
    environment:
      RENDER_CACHE_MAX_MB: ${RENDER_CACHE_MAX_MB:-8192}
    ports:
      - "127.0.0.1:3000:3001"
    volumes:
      - exports:/app/output
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  exports:
